  <script>
  (()=>{'use strict';
    const KEY='wortgarten_v1';
    const TYPES={word:'单词',sentence:'句子',grammar:'语法'};
    const LABELS={word:'Aa',sentence:'≡',grammar:'§'};
    const BASIC_PATTERNS=[{"title":"介绍姓名","tag":"物主词与 sein","note":"mein、dein、sein、ihr 会随人物变化；Name 是阳性名词。","examples":[["Mein Name ist Anna.","我的名字叫安娜。"],["Dein Name ist Paul.","你的名字叫保罗。"],["Sein Name ist Max.","他的名字叫马克斯。"]],"quiz":[["___ Name ist Anna.","Mein","我的名字"],["___ Name ist Paul.","Dein","你的名字"],["___ Name ist Max.","Sein","他的名字"],["___ Name ist Lea.","Ihr","她的名字"]]},{"title":"我是，你是","tag":"sein 动词变位","note":"sein 的现在时：ich bin、du bist、er/sie ist。","examples":[["Ich bin müde.","我累了。"],["Du bist nett.","你很友善。"],["Er ist groß.","他很高。"]],"quiz":[["Ich ___ müde.","bin","我累了"],["Du ___ nett.","bist","你很友善"],["Er ___ groß.","ist","他很高"],["Sie ___ hier.","ist","她在这里"]]},{"title":"我有，你有","tag":"haben 与第四格","note":"haben 的直接宾语用第四格。阳性名词前 ein → einen；阴性 eine、中性 ein。","examples":[["Ich habe einen Hund.","我有一只狗。"],["Du hast eine Katze.","你有一只猫。"],["Er hat ein Buch.","他有一本书。"]],"dynamic":"haben"},{"title":"这是……","tag":"第一格不定冠词","note":"Das ist 后面的名词在这里用第一格：阳性 ein、阴性 eine、中性 ein。","examples":[["Das ist ein Hund.","这是一只狗。"],["Das ist eine Katze.","这是一只猫。"],["Das ist ein Buch.","这是一本书。"]],"dynamic":"sein"},{"title":"我看见……","tag":"sehen 与第四格","note":"sehen 的直接宾语使用第四格：ein Hund → einen Hund。","examples":[["Ich sehe einen Hund.","我看见一只狗。"],["Du siehst eine Katze.","你看见一只猫。"],["Er sieht ein Buch.","他看见一本书。"]],"dynamic":"sehen"},{"title":"我喜欢……","tag":"定冠词第四格","note":"mögen 的直接宾语使用第四格：der → den，die、das 不变。","examples":[["Ich mag den Hund.","我喜欢那只狗。"],["Du magst die Katze.","你喜欢那只猫。"],["Er mag das Buch.","他喜欢那本书。"]],"dynamic":"moegen"},{"title":"你……吗？","tag":"一般疑问句","note":"德语一般疑问句通常把变位动词放在句首。","examples":[["Bist du müde?","你累了吗？"],["Hast du Zeit?","你有时间吗？"],["Wohnst du hier?","你住在这里吗？"]],"quiz":[["___ du müde?","Bist","你累了吗？"],["___ du Zeit?","Hast","你有时间吗？"],["___ du hier?","Wohnst","你住在这里吗？"]]},{"title":"我不……","tag":"nicht 否定","note":"nicht 可以否定形容词或其他句子成分，如 nicht müde。","examples":[["Ich bin nicht müde.","我不累。"],["Er ist nicht krank.","他没有生病。"],["Wir sind nicht spät.","我们没有迟到。"]],"quiz":[["Ich bin ___ müde.","nicht","我不累"],["Er ist ___ krank.","nicht","他没有生病"],["Wir sind ___ spät.","nicht","我们没有迟到"]]},{"title":"我住在……","tag":"wohnen 变位","note":"wohnen 的现在时：ich wohne、du wohnst、er/sie wohnt。","examples":[["Ich wohne in Berlin.","我住在柏林。"],["Du wohnst in Bonn.","你住在波恩。"],["Sie wohnt in Köln.","她住在科隆。"]],"quiz":[["Ich ___ in Berlin.","wohne","我住在柏林"],["Du ___ in Bonn.","wohnst","你住在波恩"],["Sie ___ in Köln.","wohnt","她住在科隆"]]},{"title":"我会……","tag":"können + 动词原形","note":"情态动词 können 随人称变位，另一个动词用原形，通常放在句末。","examples":[["Ich kann Klavier spielen.","我会弹钢琴。"],["Du kannst gut singen.","你唱歌唱得好。"],["Er kann Deutsch sprechen.","他会说德语。"]],"quiz":[["Ich ___ Klavier spielen.","kann","我会弹钢琴"],["Du ___ gut singen.","kannst","你唱歌唱得好"],["Er ___ Deutsch sprechen.","kann","他会说德语"]]}];

    function practiceNouns(){
  const result=[],seen=new Set();
  const seeded=[{word:'Hund',article:'der',translation:'狗'},{word:'Katze',article:'die',translation:'猫'},{word:'Buch',article:'das',translation:'书'}];
  for(const i of [...db.items.filter(x=>x.type==='word'),...seeded]){
    const w=String(i.word||'').trim(),gender=i.article;
    if(!w||!['der','die','das'].includes(gender))continue;
    const key=w.toLocaleLowerCase('de-DE');
    if(!seen.has(key)){seen.add(key);result.push({word:w,article:gender,translation:i.translation||''})}
  }
  return result;
}

}

    let suggestionVersion=0;
    function cleanWiktionaryPlural(value){
      let v=String(value||'').split('\n')[0].replace(/\[\[(?:[^\]|]*\|)?([^\]]+)\]\]/g,'$1').replace(/<[^>]+>/g,'').replace(/'{2,}/g,'').trim();
      if(v.length>65||/[{}<>]/.test(v)||/^(?:-|—|–|kein Plural|ohne Plural|\?)$/i.test(v))return '';
      return v;
    }
    function parseGermanEntry(raw){
      const start=raw.search(/^==[^\n]*\{\{Sprache\|Deutsch\}\}[^\n]*==/im);
      if(start<0)return null;
      const tail=raw.slice(start),next=tail.slice(3).search(/^==[^\n]*\{\{Sprache\|[^}]+\}\}[^\n]*==/im);
      const german=next<0?tail:tail.slice(0,next+3);
      const nouns=[...german.matchAll(/\{\{Wortart\|Substantiv\|Deutsch\}\}([^\n]{0,160})/g)];
      if(nouns.length){
        const genders=nouns.map(m=>/\{\{([mfn])\}\}/.exec(m[1])?.[1]).filter(Boolean);
        if(!genders.length)return null;
        const distinct=[...new Set(genders)];
        if(distinct.length>1)return {ambiguous:true};
        const first=nouns[0].index,detail=german.slice(first,first+2000);
        const plural=/\|\s*Nominativ Plural\s*=\s*([^\n|}]+)/i.exec(detail);
        return {article:{m:'der',f:'die',n:'das'}[distinct[0]],plural:cleanWiktionaryPlural(plural?.[1]),pos:'名词'};
      }
      if(/\{\{Wortart\|Verb\|Deutsch\}\}/.test(german))return {pos:'动词'};
      if(/\{\{Wortart\|Adjektiv\|Deutsch\}\}/.test(german))return {pos:'形容词'};
      if(/\{\{Wortart\|Adverb\|Deutsch\}\}/.test(german))return {pos:'副词'};
      return null;
    }
    async function queryWiktionary(word){
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6500);
      try{
        const q=new URLSearchParams({action:'parse',page:word,prop:'wikitext',format:'json',origin:'*'});
        const resp=await fetch('https://de.wiktionary.org/w/api.php?'+q.toString(),{signal:controller.signal,credentials:'omit'});
        if(!resp.ok)throw new Error('HTTP '+resp.status);
        const json=await resp.json();
        const content=json.parse?.wikitext?.['*'];
        return typeof content==='string'?parseGermanEntry(content):null;
      }finally{clearTimeout(timeout)}
    }
    async function suggestWord(){
      const box=document.getElementById('f-word');if(!box)return;
      const raw=box.value.trim(),parts=raw.match(/^(der|die|das)\s+(.+)$/i),word=parts?parts[2].trim():raw,request=++suggestionVersion;
      if(!word){const info=document.getElementById('word-suggestion');if(info)info.textContent='输入德语单词后自动尝试补全';return}
      const status=document.getElementById('word-suggestion');
      if(parts){
        const article=document.getElementById('f-article');if(article&&!article.value)article.value=parts[1].toLowerCase();
        box.value=word;
      }
      const stableWord=box.value;
      const setStatus=t=>{const el=document.getElementById('word-suggestion');if(el&&request===suggestionVersion)el.textContent=t};
      const fill=suggestion=>{
        if(!suggestion||request!==suggestionVersion||document.getElementById('f-word')?.value!==stableWord)return 0;
        if(suggestion.ambiguous){setStatus('这个词有多种词性或性别，请根据词义手动选择');return 0}
        const articleEl=document.getElementById('f-article');
        if(articleEl?.value&&suggestion.article&&articleEl.value!==suggestion.article){setStatus('你填写的冠词与查询结果不同，请核对词义');return 0}
        let count=0;
        for(const k of ['article','translation','plural','pos']){
          const el=document.getElementById('f-'+k);
          if(el&&!String(el.value).trim()&&suggestion[k]){el.value=suggestion[k];count++}
        }
        return count;
      };
      const entry=WORD_SUGGEST[word.toLocaleLowerCase('de-DE')];
      if(entry){
        const n=fill({...entry,pos:entry.article?'名词':''});
        if(n)setStatus('已自动补全，可手动修改');
        else if(!status?.textContent?.includes('不同'))setStatus('已找到词典建议，保留你填写的内容');
        return;
      }
      setStatus('正在查询德语词典…');
      const lookupWord=word.charAt(0).toLocaleUpperCase('de-DE')+word.slice(1);
      try{
        const found=await queryWiktionary(lookupWord);
        if(request!==suggestionVersion||document.getElementById('f-word')?.value!==stableWord)return;
        if(!found){setStatus('词典暂无可靠结果；可手动填写');return}

      }catch(e){setStatus('在线词典暂时不可用，请手动填写或稍后重试')}
    }
