    :root{color-scheme:light;--bg:#f7f5ee;--paper:#fffefa;--text:#29322c;--muted:#788078;--line:#e7e6dc;--forest:#254f3f;--leaf:#e3eddd;--gold:#f6d886;--gold-light:#fff0c9;--pink:#f8e9e0;--shadow:0 14px 45px rgba(46,57,42,.055);--radius:20px}
    *{box-sizing:border-box} html{height:100%} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.55} .app{max-width:620px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(104px + env(safe-area-inset-bottom))} .topbar{display:flex;align-items:center;justify-content:space-between;padding:25px 2px 21px}.brand{display:flex;gap:11px;align-items:center}.mark{display:grid;place-items:center;width:40px;height:40px;background:#e5ecdb;border-radius:13px;font-size:24px}.brand b{display:block;font-family:Georgia,serif;letter-spacing:.2px;font-size:20px;font-weight:700}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.date-pill{font-size:12px;color:#5b6a5a;background:#eff1e8;border-radius:999px;padding:9px 12px}h1,h2,h3,p{margin-top:0}.page-head{margin:7px 2px 19px}.eyebrow{color:#718675;font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:7px}.page-head h1{font-size:29px;letter-spacing:-1px;font-weight:750;margin-bottom:7px}.sub{color:var(--muted);font-size:13px;line-height:1.7}.hero{border:1px solid #e3e9d9;border-radius:25px;min-height:191px;padding:22px 22px 23px;background:linear-gradient(125deg,#e9f1e2 0%,#f0f4e8 58%,#fff9e9 100%);position:relative;overflow:hidden}.hero .flower{position:absolute;right:14px;top:10px;font-size:78px;transform:rotate(-14deg);opacity:.9}.hero .label{font-size:13px;color:#5d7463;font-weight:700}.hero .number{font-family:Georgia,serif;font-size:58px;line-height:1;margin:9px 0 8px;color:#234936}.hero .helper{font-size:12px;color:#627369}.hero .row-actions{position:relative;margin-top:20px;display:flex;gap:9px}.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:11px 17px;border-radius:12px;border:1px solid transparent;font-weight:650;font-size:13px;background:#f3f3eb;color:var(--text)}.btn.primary{background:var(--forest);color:#fff}.btn.outline{background:transparent;border-color:#d0d9c7;color:var(--forest)}.btn.soft{background:#eaf1e3;color:var(--forest)}.btn.danger{background:#fff0ee;color:#a03a36}.btn.full{width:100%}.btn.small{padding:8px 11px;font-size:12px;border-radius:10px}.section{margin-top:25px}.section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.section-header h2{font-size:17px;margin:0}.text-link{border:0;background:none;color:var(--forest);font-weight:700;font-size:12px;padding:6px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:17px 10px;text-align:center}.stat strong{display:block;font-family:Georgia,serif;font-size:29px;color:#314d3b}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.mini-note{font-size:13px;line-height:1.8;background:var(--paper);padding:16px 18px;border-radius:16px;border:1px solid var(--line);color:#58645b}.mini-note strong{color:var(--forest)}.quickadd{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{border:1px solid var(--line);background:var(--paper);padding:14px 7px;border-radius:15px;font-size:12px;text-align:center;color:#526257}.quick .ico{display:block;font-size:22px;margin-bottom:8px}.progress-track{height:7px;border-radius:20px;background:#e0e6dc;overflow:hidden;margin-top:17px}.progress-bar{height:100%;background:var(--forest);border-radius:20px;transition:width .2s}.progress-label{display:flex;justify-content:space-between;color:#627465;font-size:11px;margin-top:6px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,249,.96);border-top:1px solid #e8e8de;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px max(8px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:20;display:flex;justify-content:center}.navinner{display:grid;grid-template-columns:repeat(5,1fr);max-width:620px;width:100%}.navbtn{border:0;background:none;color:#9a9f97;display:flex;flex-direction:column;align-items:center;gap:5px;padding:3px 0 0;font-size:10px;font-weight:650}.navbtn .navico{display:grid;place-items:center;border-radius:12px;height:31px;min-width:44px;font-size:21px}.navbtn.active{color:var(--forest)}.navbtn.active .navico{background:#e5ede0}.toolbar{display:flex;gap:10px;margin-bottom:15px}.search{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 13px;width:100%;outline:none;font-size:14px;color:var(--text)}.search:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#879f8c;box-shadow:0 0 0 3px rgba(91,136,99,.11)}.list{display:flex;flex-direction:column;gap:10px}.entry{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px 16px}.entry-top{display:flex;align-items:flex-start;gap:12px}.entry-main{min-width:0;flex:1}.entry-title{font-size:18px;font-weight:750;line-height:1.45;word-break:break-word}.entry-sub{font-size:13px;line-height:1.7;margin-top:5px;color:#607062;white-space:pre-wrap;overflow-wrap:anywhere}.entry-note{font-size:12px;color:#8a8f84;line-height:1.6;margin-top:8px;white-space:pre-wrap}.entry-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.tag{font-size:11px;border-radius:999px;padding:5px 9px;background:#eef2e9;color:#648065}.tag.gold{background:var(--gold-light);color:#866f36}.tag.pink{background:#f7eae7;color:#a77762}.entry-actions{display:flex;align-items:center;gap:5px}.iconbtn{width:31px;height:31px;border:0;background:#f3f3eb;border-radius:10px;display:grid;place-items:center;color:#667367;font-size:14px}.iconbtn.play{background:#e7eee0;color:#2d5542}.empty{text-align:center;padding:54px 23px;background:var(--paper);border:1px dashed #d7d9cc;border-radius:19px}.empty .emoji{font-size:39px;margin-bottom:12px}.empty h3{font-size:16px;margin-bottom:7px}.empty p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:17px}.seg{display:flex;background:#eceee6;border-radius:12px;padding:4px;gap:3px;margin-bottom:14px}.seg button{flex:1;background:none;border:0;color:#6f796e;font-size:12px;border-radius:9px;padding:9px 6px}.seg button.selected{background:white;color:var(--forest);font-weight:700;box-shadow:0 1px 7px rgba(0,0,0,.04)}.review-header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 17px}.review-progress{font-size:12px;color:var(--muted)}.flashcard{border-radius:24px;background:var(--paper);border:1px solid #e9e9de;box-shadow:var(--shadow);padding:27px 21px 25px;min-height:298px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;position:relative}.flashcard .type{position:absolute;top:21px;left:21px;font-size:11px;color:#668271;font-weight:700}.flashcard .speak{position:absolute;top:17px;right:18px}.flashfront{font-family:Georgia,"PingFang SC",serif;font-size:30px;line-height:1.45;overflow-wrap:anywhere;margin:22px 0}.flashhint{color:#a4aaa0;font-size:12px}.flashanswer{font-size:19px;line-height:1.65;color:var(--forest);margin:18px 0 0;font-weight:650;white-space:pre-wrap}.flashdetail{font-size:13px;color:#7f877d;margin-top:15px;line-height:1.8;white-space:pre-wrap}.reviewbuttons{margin-top:17px;display:grid;gap:9px;grid-template-columns:repeat(4,minmax(0,1fr))}.reviewbuttons button{border:1px solid #e2e5da;background:var(--paper);border-radius:13px;padding:12px 5px;font-weight:700;font-size:12px}.reviewbuttons button small{display:block;font-size:10px;color:#889388;font-weight:500;margin-top:5px}.reviewbuttons .again{background:#faebe7;color:#a34a3b}.reviewbuttons .easy{background:#e6f0e2;color:#325e44}.center{text-align:center}.complete{padding:54px 10px}.complete .emoji{font-size:57px}.complete h2{font-size:25px}.muted{color:var(--muted)}.grammar-example{border-left:3px solid #d7dfc8;padding:7px 0 7px 12px;color:#476a54;margin-top:8px;font-size:13px;white-space:pre-wrap}.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:12px}.settings-card h3{font-size:15px;margin-bottom:9px}.settings-card p{font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:13px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:750;color:#657368}.field input,.field textarea,.field select{background:white;width:100%;border:1px solid #e0e5db;border-radius:12px;padding:12px 13px;outline:none;font-size:15px;color:var(--text);resize:vertical}.field textarea{min-height:85px;line-height:1.6}.field small{font-size:11px;color:#99a094}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-wrap{position:fixed;inset:0;background:rgba(26,38,30,.38);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:0}.modal{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.12)}.modal-title{display:flex;justify-content:space-between;align-items:center}.modal-title h2{font-size:19px;margin:0}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions .btn{flex:1}.hintbox{background:#edf1e7;padding:11px 13px;font-size:12px;line-height:1.7;color:#697769;border-radius:11px;margin-top:13px}.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2f493a;color:white;padding:11px 16px;border-radius:12px;z-index:100;font-size:12px;min-width:110px;text-align:center;box-shadow:0 10px 25px #0002}.pillnum{display:inline-block;min-width:18px;height:18px;padding:2px 5px;border-radius:9px;background:#dce7d8;color:var(--forest);font-size:10px;margin-left:5px}.dangerline{border-top:1px solid var(--line);padding-top:16px;margin-top:17px} .example-banner{background:#fff5db;border:1px solid #f1e4c1;border-radius:12px;padding:10px 13px;color:#96774b;font-size:12px;line-height:1.7;margin-bottom:14px}.word-count{font-size:12px;color:#8b9289}.shortcut{border:0;border-radius:8px;padding:5px 8px;font-size:13px;margin-right:4px;background:#e9eee5;color:#365e44}.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}.toggle-label{display:flex;align-items:center;gap:8px;color:#667469;font-size:12px;margin-bottom:15px}.toggle-label input{accent-color:var(--forest)}@media(min-width:720px){.app{padding-left:24px;padding-right:24px}.modal{margin:auto;border-radius:24px;max-height:86vh}.modal-wrap{align-items:center;padding:20px}}@media(max-width:350px){.flashfront{font-size:25px}.page-head h1{font-size:26px}.hero .flower{font-size:60px}}

    /* Lex: neutral, compact visual language */
    :root{--bg:#f6f7f9;--paper:#fff;--text:#222936;--muted:#727b89;--line:#e3e7ed;--forest:#222936;--leaf:#e9edf3;--gold-light:#f7f1e0;--shadow:0 14px 38px rgba(34,41,54,.055)}
    .brand .mark{background:#222936;color:white;font:700 19px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;border-radius:11px;letter-spacing:-1px}
    .brand b{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;letter-spacing:-.7px}
    .brand small{font-size:9px;letter-spacing:.7px}
    .date-pill{background:#edf0f4;color:#667080}
    .eyebrow{color:#7a8390;letter-spacing:1.4px}

<body>
  <div class="app" id="app"></div>
  <div id="overlay"></div>
  <div id="toast" aria-live="polite"></div>
  <script>
  (()=>{'use strict';
    const KEY='wortgarten_v1';
    const TYPES={word:'单词',sentence:'句子',grammar:'语法'};
    const LABELS={word:'Aa',sentence:'≡',grammar:'§'};
    const SAMPLES=[
      {id:'sample-w1',type:'word',word:'Bruder',article:'der',pos:'名词',translation:'兄弟；哥哥／弟弟',plural:'Brüder',example:'Das ist mein Bruder.',note:'复数注意变音：u → ü'},
      {id:'sample-w2',type:'word',word:'Schwester',article:'die',pos:'名词',translation:'姐妹；姐姐／妹妹',plural:'Schwestern',example:'Ist das deine Schwester?'},
      {id:'sample-w3',type:'word',word:'Kind',article:'das',pos:'名词',translation:'孩子',plural:'Kinder',example:'Das Kind ist klein.'},
      {id:'sample-w4',type:'word',word:'heute',article:'',pos:'副词',translation:'今天',example:'Heute lerne ich Deutsch.'},
      {id:'sample-w5',type:'word',word:'lustig',article:'',pos:'形容词',translation:'有趣的；好笑的',note:'词尾 -ig 在德国标准德语中常读作类似 -ich 的音。'},
      {id:'sample-s1',type:'sentence',german:'Das ist mein Bruder.',translation:'这是我的兄弟。',note:'Das ist … = 这是……'},
      {id:'sample-s2',type:'sentence',german:'Ist das deine Schwester?',translation:'这是你的姐妹吗？',note:'一般疑问句：变位动词放句首。'},
      {id:'sample-s3',type:'sentence',german:'Ich habe ein Buch.',translation:'我有一本书。',note:'habe 是 haben 的第一人称单数形式。'},
      {id:'sample-g1',type:'grammar',title:'名词的定冠词',explanation:'德语名词有语法性别。学习名词时，一起记住 der（阳性）、die（阴性）、das（中性）。',example:'der Bruder\ndie Schwester\ndas Kind',tag:'名词'},
      {id:'sample-g2',type:'grammar',title:'一般疑问句的语序',explanation:'没有疑问词的一般疑问句，变位动词通常放在句首。',example:'Das ist dein Bruder.\n→ Ist das dein Bruder?',tag:'语序'}
    ];
    const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const today=()=>fmt(new Date());
    const addDays=(date,days)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return fmt(d)};
    const uid=()=>globalThis.crypto?.randomUUID?.() || ('w'+Date.now()+Math.random().toString(36).slice(2,9));
    const reviewDefault=()=>({due:today(),interval:0,ease:2.5,reps:0,lapses:0});
    const newStore=()=>({version:1,items:SAMPLES.map((x,i)=>({...x,review:reviewDefault(),createdAt:new Date(Date.now()-i*1000).toISOString(),sample:true})),logs:[],settings:{goal:10,reverse:false}});
    const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items)&&Array.isArray(d.logs))return {version:1,items:d.items,logs:d.logs,settings:{goal:10,reverse:false,...(d.settings||{})}}}catch(e){}return newStore()};
    let db=load(),page='today',search='',filter='all',modal=null,session=null,showAnswer=false,toastTimer=null;
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const line=s=>safe(s).replace(/\n/g,'<br>');
    const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){message('保存失败：设备存储不可用，请导出备份');return false}};
    const due=i=>(i.review?.due||today())<=today();
    const dailyLogs=()=>db.logs.filter(x=>x.date===today()).length;
    const dueItems=()=>db.items.filter(due).sort((a,b)=>(a.review?.due||'').localeCompare(b.review?.due||''));
    const entryTitle=i=>i.type==='word'? [i.article,i.word].filter(Boolean).join(' '):i.type==='sentence'?i.german:i.title;
    const entryAnswer=i=>i.type==='grammar'?i.explanation:i.translation;
    const count=t=>db.items.filter(x=>x.type===t).length;
    const streak=()=>{const dates=new Set(db.logs.map(x=>x.date));let d=today(),n=0;if(!dates.has(d))d=addDays(d,-1);while(dates.has(d)){n++;d=addDays(d,-1)}return n};
    const say=t=>{if(!('speechSynthesis' in window)){message('此浏览器暂不支持朗读');return}try{window.speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(t);s.lang='de-DE';s.rate=.83;s.pitch=1;window.speechSynthesis.speak(s)}catch(e){message('朗读暂不可用')}};
    function message(t){const el=document.getElementById('toast');el.innerHTML='<span class="toast">'+safe(t)+'</span>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',2800)}
    function iconMenu(){return `<div class="tabbar"><nav class="navinner" aria-label="页面导航">${[['today','◫','今日'],['word','Aa','单词'],['sentence','≡','句子'],['grammar','§','语法'],['me','⚙','我的']].map(([id,ico,name])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span class="navico">${ico}</span>${name}</button>`).join('')}</nav></div>`}
    const header=()=>`<header class="topbar"><div class="brand"><span class="mark">L.</span><span><b>Lex</b><small>DEUTSCH · STUDY NOTES</small></span></div><span class="date-pill">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}</span></header>`;
    const empty=(emoji,title,detail,action,label)=>`<div class="empty"><div class="emoji">${emoji}</div><h3>${title}</h3><p>${detail}</p>${action?`<button class="btn primary" data-action="${action}">${label}</button>`:''}</div>`;
    function renderToday(){const d=dueItems().length,done=dailyLogs(),goal=Math.max(1,Number(db.settings.goal)||10);return `<div class="page-head"><div class="eyebrow">LEX / DAILY REVIEW</div><h1>今天的复习</h1><div class="sub">单词、句子、语法，按自己的节奏积累。</div></div>
      <div class="hero"><div class="flower">DE</div><div class="label">今日待复习</div><div class="number">${d}</div><div class="helper">${d?'来自你的学习记录':'今天的复习已完成'}</div><div class="row-actions"><button class="btn primary" data-action="${d?'start':'revisit'}">${d?'开始复习 →':'再看一遍'}</button><button class="btn outline" data-action="add-word">＋ 新单词</button></div><div class="progress-track"><div class="progress-bar" style="width:${Math.min(100,Math.round(done/goal*100))}%"></div></div><div class="progress-label"><span>今日已复习 ${done} 次</span><span>目标 ${goal} 次</span></div></div>
      <div class="section"><div class="section-header"><h2>知识概览</h2><span class="word-count">学习进度</span></div><div class="grid-3"><div class="stat"><strong>${count('word')}</strong><span>单词</span></div><div class="stat"><strong>${count('sentence')}</strong><span>句子</span></div><div class="stat"><strong>${count('grammar')}</strong><span>语法笔记</span></div></div></div>
      <div class="section"><div class="section-header"><h2>快捷添加</h2></div><div class="quickadd"><button class="quick" data-action="add-word"><span class="ico">Aa</span>添加单词</button><button class="quick" data-action="add-sentence"><span class="ico">≡</span>添加句子</button><button class="quick" data-action="add-grammar"><span class="ico">§</span>添加语法</button></div></div>
      <div class="section"><div class="mini-note"><strong>复习规则</strong>　记下今天遇到的知识，Lex 会根据你的记忆情况安排下一次复习。</div></div>`}
    function entryHTML(i){const rev=i.review||reviewDefault();let info=i.type==='word'?[i.pos,i.plural?`复数：${i.plural}`:''].filter(Boolean).join(' · '):i.type==='grammar'?i.tag||'语法笔记':'';
      return `<article class="entry"><div class="entry-top"><div class="entry-main"><div class="entry-title">${safe(entryTitle(i))}</div><div class="entry-sub">${line(entryAnswer(i))}</div>${i.type==='grammar'&&i.example?`<div class="grammar-example">${line(i.example)}</div>`:''}${i.type==='word'&&i.example?`<div class="entry-note">例句：${line(i.example)}</div>`:''}${i.note?`<div class="entry-note">✎ ${line(i.note)}</div>`:''}</div>${i.type!=='grammar'?`<button class="iconbtn play" aria-label="朗读" data-say="${safe(i.id)}">▶</button>`:''}</div><div class="entry-footer"><span class="tag ${due(i)?'gold':''}">${due(i)?'待复习':rev.reps?'下次：'+safe(rev.due):'新加入'}${info?' · '+safe(info):''}</span><div class="entry-actions"><button class="iconbtn" aria-label="编辑" data-edit="${safe(i.id)}">✎</button><button class="iconbtn" aria-label="删除" data-delete="${safe(i.id)}">×</button></div></div></article>`}
    function renderCollection(type){const name=TYPES[type],n=count(type),items=db.items.filter(i=>i.type===type).filter(i=>{const q=search.toLowerCase();return !q || [entryTitle(i),entryAnswer(i),i.example,i.note,i.tag,i.plural].some(s=>String(s||'').toLowerCase().includes(q))}).filter(i=>filter==='all'||(filter==='due'?due(i):!!i.review?.reps));
      return `<div class="page-head"><div class="eyebrow">MEINE SAMMLUNG</div><div class="row-between"><h1>${type==='word'?'单词收藏':type==='sentence'?'句子收藏':'我的语法本'}</h1><button class="btn primary small" data-action="add-${type}">＋ 添加</button></div><div class="sub">${type==='grammar'?'把零散的发现，慢慢整理成自己的语法体系。':`已经收藏 ${n} ${type==='word'?'个单词':'个句子'}，随时可以编辑和复习。`}</div></div><div class="toolbar"><input class="search" id="search" type="search" placeholder="搜索德语或中文…" value="${safe(search)}" autocomplete="off"></div><div class="seg"><button class="${filter==='all'?'selected':''}" data-filter="all">全部</button><button class="${filter==='due'?'selected':''}" data-filter="due">待复习</button><button class="${filter==='learned'?'selected':''}" data-filter="learned">已练习</button></div><div class="list" id="entries">${items.length?items.map(entryHTML).join(''):empty('＋',search?'没有找到相关内容':'这里还没有内容',search?'试试其他关键词。':'你可以随手记下课堂里遇到的知识。',search?'':`add-${type}`,'添加第一条')}</div>${db.items.some(i=>i.sample&&i.type===type)?`<div style="height:16px"></div><div class="example-banner">已加入几条入门示例，你可以编辑或删除。新增内容保存在当前设备中。</div>`:''}`}
    function renderMe(){return `<div class="page-head"><div class="eyebrow">MEIN FORTSCHRITT</div><h1>我的学习记录</h1><div class="sub">让学习保持轻盈，但不要让记忆轻易溜走。</div></div><div class="grid-3" style="margin-bottom:20px"><div class="stat"><strong>${streak()}</strong><span>连续复习天数</span></div><div class="stat"><strong>${db.logs.length}</strong><span>累计复习次数</span></div><div class="stat"><strong>${db.items.filter(x=>x.review?.reps>0).length}</strong><span>练习过的卡片</span></div></div>
      <div class="settings-card"><h3>每日复习目标</h3><p>你可以按当天精力调整，不必每天完成很多。</p><div class="row-between"><input id="goal" class="search" type="number" inputmode="numeric" min="1" max="200" style="max-width:100px" value="${safe(db.settings.goal)}"><button class="btn primary small" data-action="save-goal">保存目标</button></div></div>
      <div class="settings-card"><h3>复习方向</h3><p>默认看德语回忆中文。也可以反过来，看中文回忆德语，更适合主动输出。</p><label class="toggle-label" style="margin-bottom:0"><input type="checkbox" id="reverse" ${db.settings.reverse?'checked':''}> 看中文，回忆德语（反向复习）</label></div>
      <div class="settings-card"><h3>数据备份与恢复</h3><p><strong>重要：</strong>所有内容保存在当前浏览器里，不会上传服务器。换手机、清理浏览器网站数据或卸载应用可能导致丢失，请定期导出 JSON 备份。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn soft" data-action="export">↓ 导出备份</button><button class="btn outline" data-action="import">↑ 导入备份</button></div><input id="importfile" type="file" accept=".json,application/json" style="display:none"></div>
      <div class="settings-card"><h3>如何安排复习？</h3><p>点击“再学一次 / 有点难 / 记住了 / 很简单”，不同记忆程度决定下次复习日期。同一天答错的内容会重新排到本轮末尾。语法笔记也可以参与复习。</p><div class="dangerline"><button class="btn danger small" data-action="reset">清空所有本机学习记录</button></div></div>`}
    const itemById=id=>db.items.find(i=>i.id===id);
    function startSession(){const ids=dueItems().map(x=>x.id);if(!ids.length){message('今天没有待复习卡片，明天再来看看吧');return}session={queue:ids,index:0,initial:ids.length,completed:0};showAnswer=false;render()}
    function current(){return session?itemById(session.queue[session.index]):null}
    function renderReview(){const i=current();if(!i){const n=session?.completed||0;return `<div class="complete center"><div class="emoji">✓</div><h2>Gut gemacht!</h2><p class="sub">本轮已完成 ${n} 张卡片的复习。<br>明天也继续一点点吧。</p><button class="btn primary" data-action="review-end">返回首页</button></div>`}
      const reversed=db.settings.reverse && i.type!=='grammar';const front=reversed?entryAnswer(i):entryTitle(i);const back=reversed?entryTitle(i):entryAnswer(i);const detail=i.type==='word'?[i.plural?`复数：${i.plural}`:'',i.example?`例句：${i.example}`:'',i.note||''].filter(Boolean).join('\n'):i.type==='sentence'?(i.note||''):(i.example||'');const tts=i.type==='word'?entryTitle(i):i.type==='sentence'?i.german:(i.example||'');
      return `<div class="review-header"><button class="btn outline small" data-action="review-end">← 退出复习</button><span class="review-progress">已完成 ${session.completed} · 本轮剩余 ${session.queue.length-session.index}</span></div><div class="progress-track" style="margin:0 0 24px"><div class="progress-bar" style="width:${Math.min(100,session.index/session.queue.length*100)}%"></div></div>
      <div class="flashcard"><div class="type">${LABELS[i.type]} ${TYPES[i.type]}</div>${tts?`<button class="iconbtn speak" data-say="${safe(i.id)}" aria-label="德语朗读">▶</button>`:''}<div class="flashfront">${line(front)}</div><div class="flashhint">${showAnswer?'想一想：自己是否真的记住了？':'先在心里回答，再翻开答案'}</div>${showAnswer?`<div class="flashanswer">${line(back)}</div>${detail?`<div class="flashdetail">${line(detail)}</div>`:''}`:''}</div>
      ${!showAnswer?`<div style="margin-top:18px"><button class="btn primary full" data-action="reveal">显示答案</button></div>`:`<div class="reviewbuttons"><button class="again" data-grade="again">再学一次<small>本轮再见</small></button><button data-grade="hard">有点难<small>2 天后</small></button><button data-grade="good">记住了<small>正常间隔</small></button><button class="easy" data-grade="easy">很简单<small>延长间隔</small></button></div>`}<p class="center muted" style="font-size:12px;margin-top:23px">根据记忆情况选择，下次会自动安排复习。</p>`}
    function grade(g){const i=current();if(!i||!showAnswer)return;const r={...reviewDefault(),...i.review},old=Math.max(0,Number(r.interval)||0);let next=1;if(g==='again'){r.lapses++;r.reps=0;r.ease=Math.max(1.3,r.ease-.18);next=1;session.queue.push(i.id)}else if(g==='hard'){next=old<=1?2:Math.max(2,Math.round(old*1.25));r.ease=Math.max(1.3,r.ease-.08);r.reps++}else if(g==='good'){next=old<1?1:old===1?3:Math.max(old+1,Math.round(old*r.ease));r.reps++}else{next=old<1?4:old===1?7:Math.max(old+2,Math.round(old*r.ease*1.35));r.ease=Math.min(3.2,r.ease+.12);r.reps++}r.interval=next;r.due=addDays(today(),next);i.review=r;db.logs.push({date:today(),id:i.id,grade:g});session.completed++;session.index++;showAnswer=false;store();render()}
    const input=(key,label,value='',extra='')=>`<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" name="${key}" value="${safe(value)}" ${extra}></div>`;
    const area=(key,label,value='',hint='')=>`<div class="field"><label for="f-${key}">${label}</label><textarea id="f-${key}" name="${key}" rows="3">${safe(value)}</textarea>${hint?`<small>${hint}</small>`:''}</div>`;
    const select=(key,label,values,value='')=>`<div class="field"><label for="f-${key}">${label}</label><select id="f-${key}" name="${key}">${values.map(([k,v])=>`<option value="${safe(k)}" ${value===k?'selected':''}>${safe(v)}</option>`).join('')}</select></div>`;
    function renderModal(){if(!modal)return '';const i=modal.id?itemById(modal.id):{type:modal.type};if(!i)return '';let fields='';if(i.type==='word')fields=`${input('word','德语单词 *',i.word,'required placeholder="例如 Bruder"')}<div class="fieldrow">${select('article','定冠词',[['','无／暂不填写'],['der','der · 阳性'],['die','die · 阴性'],['das','das · 中性']],i.article||'')}${select('pos','词性',[['名词','名词'],['动词','动词'],['形容词','形容词'],['副词','副词'],['其他','其他']],i.pos||'其他')}</div>${input('translation','中文意思 *',i.translation,'required placeholder="例如 兄弟"')}${input('plural','复数形式（可选）',i.plural,'placeholder="例如 Brüder"')}${area('example','例句（可选）',i.example)}${area('note','其他笔记（可选）',i.note)}`;
      if(i.type==='sentence')fields=`${area('german','德语句子 *',i.german)}${area('translation','中文意思 *',i.translation)}${area('note','语法观察 / 使用场景（可选）',i.note,'可以先写一句简单的发现，将来再整理到语法本。')}`;
      if(i.type==='grammar')fields=`${input('title','语法主题 *',i.title,'required placeholder="例如 人称代词第四格"')}${area('explanation','你的理解 / 规则 *',i.explanation,'不必一次写完整，随着学习随时回来补充。')}${area('example','例句（可选）',i.example)}${input('tag','分类（可选）',i.tag,'placeholder="例如 格、语序、动词"')}`;
      return `<div class="modal-wrap" id="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="编辑学习卡"><div class="modal-title"><h2>${modal.id?'编辑':'新增'}${TYPES[i.type]}</h2><button class="iconbtn" data-action="modal-close" aria-label="关闭">×</button></div><div class="hintbox">${i.type==='word'?'德语名词尽量和 der / die / das 一起记。':i.type==='sentence'?'先把你真的读到、说过的句子留下来。':'语法不必一次弄懂，可以反复修改。'}</div><form id="entry-form"><div class="row-between" style="margin-top:13px"><span class="word-count">德语特殊字母</span><span>${['ä','ö','ü','ß','Ä','Ö','Ü'].map(x=>`<button type="button" class="shortcut" data-insert="${x}">${x}</button>`).join('')}</span></div>${fields}<div class="modal-actions"><button class="btn outline" type="button" data-action="modal-close">取消</button><button class="btn primary" type="submit">保存并加入复习</button></div></form></section></div>`}
    function render(){document.getElementById('app').innerHTML=header()+(session?renderReview():page==='today'?renderToday():page==='me'?renderMe():renderCollection(page))+(!session?iconMenu():'');document.getElementById('overlay').innerHTML=renderModal();}
    function openEditor(type,id){modal={type,id};render();document.getElementById('f-'+(type==='word'?'word':type==='sentence'?'german':'title'))?.focus()}
    function saveEditor(form){const type=modal.type,fields=Object.fromEntries(new FormData(form).entries());const must=type==='word'?['word','translation']:type==='sentence'?['german','translation']:['title','explanation'];if(must.some(k=>!String(fields[k]||'').trim())){message('请填写必填内容');return}let i=modal.id?itemById(modal.id):null;if(i){Object.assign(i,fields,{sample:false})}else{db.items.unshift({id:uid(),type,...fields,review:reviewDefault(),createdAt:new Date().toISOString(),sample:false})}modal=null;store();render();message('保存成功，已加入复习')}
    function exportData(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Lex-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);message('备份文件已生成')}
    function importData(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.items)||!Array.isArray(d.logs)||d.items.length>50000||d.items.some(x=>!x.id||!TYPES[x.type]))throw Error('格式不符合预期');if(!confirm(`要恢复 ${d.items.length} 张卡片吗？这会替换本机目前的全部内容。`))return;db={version:1,items:d.items,logs:d.logs,settings:{goal:10,reverse:false,...(d.settings||{})}};store();page='today';search='';filter='all';render();message('备份恢复成功')}catch(e){message('导入失败：请选择本应用导出的 JSON 文件')}};rd.readAsText(file)}
    document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const a=button.dataset.action;if(button.dataset.page){page=button.dataset.page;search='';filter='all';window.scrollTo(0,0);render();return}if(button.dataset.filter){filter=button.dataset.filter;render();return}if(button.dataset.speak===undefined&&button.dataset.say){const i=itemById(button.dataset.say);if(i)say(i.type==='word'?entryTitle(i):i.type==='sentence'?i.german:(i.example||''));return}if(button.dataset.edit){const i=itemById(button.dataset.edit);if(i)openEditor(i.type,i.id);return}if(button.dataset.delete){const i=itemById(button.dataset.delete);if(i&&confirm(`确定要删除「${entryTitle(i)}」吗？`)){db.items=db.items.filter(x=>x.id!==i.id);store();render();message('已删除')}return}if(button.dataset.grade){grade(button.dataset.grade);return}if(button.dataset.insert){const active=document.activeElement;const target=active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA')?active:document.querySelector('#f-word, #f-german, #f-title');if(target){const a=target.selectionStart??target.value.length,b=target.selectionEnd??a;target.setRangeText(button.dataset.insert,a,b,'end');target.focus()}return}
      switch(a){case'add-word':openEditor('word');break;case'add-sentence':openEditor('sentence');break;case'add-grammar':openEditor('grammar');break;case'start':startSession();break;case'revisit':{const ids=db.items.map(i=>i.id);if(!ids.length){message('先添加一个单词或句子吧');break}session={queue:ids,index:0,initial:ids.length,completed:0};showAnswer=false;render();break}case'reveal':showAnswer=true;render();break;case'review-end':session=null;render();break;case'modal-close':modal=null;render();break;case'export':exportData();break;case'import':document.getElementById('importfile')?.click();break;case'save-goal':{const n=Number(document.getElementById('goal')?.value);if(!Number.isInteger(n)||n<1||n>200){message('请输入 1 到 200 之间的数字');return}db.settings.goal=n;store();render();message('复习目标已更新');break}case'reset':if(confirm('确定删除本机所有单词、句子、语法和复习记录吗？这无法撤销。建议先导出备份。')){db={version:1,items:[],logs:[],settings:{goal:10,reverse:false}};page='today';store();render();message('本机记录已清空')}break;}
    });
    document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();saveEditor(e.target)}});
    document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const items=db.items.filter(i=>i.type===page).filter(i=>{const q=search.toLowerCase();return [entryTitle(i),entryAnswer(i),i.example,i.note,i.tag,i.plural].some(s=>String(s||'').toLowerCase().includes(q))}).filter(i=>filter==='all'||(filter==='due'?due(i):!!i.review?.reps));document.getElementById('entries').innerHTML=items.length?items.map(entryHTML).join(''):empty('🔎','没有找到相关内容','试试其他关键词。','','')}});
    document.addEventListener('change',e=>{if(e.target.id==='reverse'){db.settings.reverse=e.target.checked;store();message(e.target.checked?'已开启反向复习':'已关闭反向复习')}if(e.target.id==='importfile'){importData(e.target.files?.[0]);e.target.value=''}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
    store();render();
    if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
  })();
  </script>
